version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 10
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
  - package-ecosystem: "docker"
    directory: "/infra/compose"
    schedule: { interval: "monthly" }
