name: Infra CI

on:
  push:
    branches: [main, "arena/**"]
    paths: ["infra/**"]
  pull_request:
    paths: ["infra/**"]

jobs:
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: docker compose -f infra/compose/docker-compose.local.yml config -q
