name: Security scan

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Phase 0: advisory scan. Hard gate (exit-code enforcement) starts Phase 1.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table
