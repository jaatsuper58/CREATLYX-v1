# ChattlyX local TURN config (CALL-01 ICE). Dev-only secret; production uses a
# rotated static-auth-secret from the secret manager and a public hostname.
listening-port=3478
tls-listening-port=5349

realm=chattlyx.local
server-name=chattlyx.local

use-auth-secret
static-auth-secret=CHANGE_ME_local_dev_only

# Local loopback has no public IP; uncomment and set for LAN testing:
# external-ip=192.168.1.10

min-port=49152
max-port=49252

fingerprint
no-cli
log-file=stdout
verbose
