name: Nightly network matrix

# Phase 0 scaffold: runs the full Android unit suite (includes ReconnectBackoff /
# heartbeat policy tests). Emulated-network tiers (EDGE/3G/loss/latency/switches,
# Section 10) are added with the messaging and call phases.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  unit-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Install platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.0" }
      - run: gradle testDebugUnitTest --stacktrace
