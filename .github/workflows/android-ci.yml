name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: write   # needed to post the build log excerpt as a commit comment

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install platform & build tools
        # ubuntu runners ship cmdline-tools under ANDROID_HOME; the old
        # android-actions/setup-android@v3 broke on the Ubuntu 26 image.
        run: |
          SDKMANAGER="${ANDROID_HOME:+$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager}"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.0" }

      - name: Static analysis (ktlint + detekt) — soft gate in Phase 0
        continue-on-error: true
        run: gradle ktlintCheck detekt --continue

      - name: Build, unit & screenshot tests
        # Roborazzi records goldens until the first set is committed (see CONTRIBUTING.md).
        run: gradle build -x ktlintCheck -x detekt -Proborazzi.test.record=true --stacktrace 2>&1 | tee build-output.log

      - name: Publish build log excerpt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Android CI failure @ $(git rev-parse --short HEAD)"
            echo '```'
            tail -c 6000 build-output.log 2>/dev/null || echo "(no log captured)"
            echo ""
            echo "--- task outcome counts ---"
            grep -oE "> Task :[^ ]+ (FROM-CACHE|UP-TO-DATE|SKIPPED)?" build-output.log | awk '{print $NF}' | sort | uniq -c || true
            grep -c "^> Task" build-output.log || true
            echo '```'
          } > failure-comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/$(git rev-parse HEAD)/comments" -F body=@failure-comment.md || true

      - name: Upload screenshot goldens (commit these under core/designsystem/src/test/screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-goldens
          path: android/core/designsystem/src/test/screenshots/**
          if-no-files-found: ignore

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            android/**/build/reports/**
            android/**/build/test-results/**
          if-no-files-found: ignore
