name: Backend CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.0" }
      - name: Build & test
        run: gradle build --stacktrace 2>&1 | tee build-output.log

      - name: Publish build log excerpt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Backend CI failure @ $(git rev-parse --short HEAD)"
            echo '```'
            tail -c 6000 build-output.log 2>/dev/null || echo "(no log captured)"
            echo ""
            echo "--- task outcome counts ---"
            grep -oE "> Task :[^ ]+ (FROM-CACHE|UP-TO-DATE|SKIPPED)?" build-output.log | awk '{print $NF}' | sort | uniq -c || true
            grep -c "^> Task" build-output.log || true
            echo '```'
          } > failure-comment.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/$(git rev-parse HEAD)/comments" -F body=@failure-comment.md || true
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-reports
          path: backend/**/build/reports/**
          if-no-files-found: ignore
