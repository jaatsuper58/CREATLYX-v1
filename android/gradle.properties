# ---- Gradle ----
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---- AndroidX / AGP ----
android.useAndroidX=true
android.nonTransitiveRClass=true
# Phase 0: opt out of AGP 9 built-in Kotlin and keep the classic, proven plugin
# interop. Migration to built-in Kotlin is tracked post-Phase-1 (docs/ARCHITECTURE.md).
android.builtInKotlin=false

# ---- R8 ----
android.enableR8.fullMode=true

# ---- ChattlyX single-source app identity (Section 1) ----
chattlyx.applicationId=com.chattlyx.app
chattlyx.versionCode=1
chattlyx.versionName=0.1.0-phase0

# AGP 9 legacy DSL: KGP 2.4 kotlin-android still needs BaseExtension (new DSL
# triggers a ClassCastException). Our conventions compile against the AGP 9
# interfaces either way; revisit when KGP supports the new DSL (ADR-0004).
android.newDsl=false

# Room 2.7.1 processor predates KSP2/AA; keep the classic pipeline.
ksp.useKSP2=false
